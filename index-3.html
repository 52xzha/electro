<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messenger</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1621;--panel:#17212b;--bub:#182533;--out:#2b5278;--acc:#5288c1;--mut:#8a9bb0;--line:#0006}
html,body{height:100%;margin:0}
body{font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:#f5f5f5;overflow:hidden}
.hid{display:none!important}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
button:disabled{opacity:.5}
button.icon{background:transparent;padding:6px 8px;font-size:20px;line-height:1}
button.icon.rec{color:#e55;animation:blink 1s infinite}
input{background:#232e3c;border:0;border-radius:8px;padding:10px 12px;color:#fff;font:inherit;outline:none;width:100%}
#auth{max-width:340px;margin:8vh auto;background:var(--panel);padding:24px;border-radius:14px;display:flex;flex-direction:column;gap:8px;animation:pop .35s ease-out}
#auth h3{margin:0 0 6px;text-align:center}
#app{display:flex;height:100%}
#side{width:320px;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .t{flex:1;min-width:0}
.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:var(--mut);font-size:12px}
#chats{flex:1;overflow:auto}
.it{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .2s,transform .15s;animation:pop .25s ease-out;user-select:none;-webkit-user-select:none}
.it:hover{background:#ffffff0a}
.it:active{transform:scale(.98)}
.it.on{background:var(--acc)}
.it .n{flex:1;min-width:0}
.it .n b{display:block}
.it .n small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.on .n small{color:#dfe9f5}
.pin{font-size:12px}
.badge{background:var(--acc);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
#msgs{flex:1;overflow:auto;padding:12px 8%;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.bub{max-width:70%;padding:6px 10px;border-radius:12px;background:var(--bub);align-self:flex-start;margin:2px 0;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease-out;user-select:none;-webkit-user-select:none}
.bub.out{background:var(--out);align-self:flex-end}
.bub .who{color:#7fb2e5;font-size:12px;display:block}
.bub small{display:block;font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.bub audio,.bub video,.bub img{display:block;max-width:100%;border-radius:8px}
.bub audio{user-select:auto;-webkit-user-select:auto}
.comp{display:flex;gap:6px;padding:8px;background:var(--panel);align-items:center}
.comp input{flex:1;border-radius:20px}
.empty{margin:auto;color:var(--mut);text-align:center;padding:20px}
#back{display:none}
#drawer{position:fixed;inset:0;z-index:20;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s}
#drawer.open{opacity:1;pointer-events:auto}
#panel{position:absolute;left:0;top:0;bottom:0;width:280px;max-width:82%;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#drawer.open #panel{transform:none}
#panel .me{font-size:18px;font-weight:600;margin-bottom:8px}
#ctx{position:fixed;z-index:30;background:var(--panel);border-radius:10px;box-shadow:0 6px 24px #0009;padding:4px;min-width:200px;animation:pop .15s ease-out}
#ctx button{display:block;width:100%;text-align:left;background:transparent;border-radius:6px;padding:10px 12px;color:#f5f5f5}
#ctx button:hover{background:#ffffff14}
#ctx button.danger{color:#ff6b6b}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.4}}
@media(max-width:700px){
  #side{width:100%}
  #app.open #side{display:none}
  #app:not(.open) #main{display:none}
  #back{display:inline-block}
  .bub{max-width:85%}
  #msgs{padding:12px 4%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="auth">
  <h3 id="at">Вход</h3>
  <input id="u" placeholder="Ник, например @anna" autocomplete="username" autocapitalize="none">
  <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <button id="go">Войти</button>
  <p id="err" style="color:#e55;margin:0;min-height:18px;font-size:13px;text-align:center"></p>
  <a href="#" id="tg" style="color:var(--acc);text-align:center;font-size:14px">Регистрация</a>
</div>

<div id="app" class="hid">
  <div id="side">
    <div class="top">
      <button class="icon" id="menu" title="Меню">☰</button>
      <div class="t"><b>Чаты</b><small id="status">онлайн</small></div>
    </div>
    <div id="chats"></div>
  </div>
  <div id="main">
    <div class="top">
      <button class="icon" id="back">←</button>
      <div class="t"><b id="hn">Выберите чат</b><small id="hs"></small></div>
    </div>
    <div id="msgs"><div class="empty">Нажмите ☰ и введите ник собеседника, например @anna.</div></div>
    <div id="cb" class="comp hid">
      <button class="icon" id="attach" title="Файл">📎</button>
      <input type="file" id="file" class="hid" accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx">
      <input id="txt" placeholder="Сообщение" autocomplete="off">
      <button class="icon" id="mic" title="Голосовое">🎤</button>
      <button id="send">➤</button>
    </div>
  </div>
</div>

<div id="drawer">
  <div id="panel">
    <div class="me" id="me"></div>
    <small id="ver" style="color:var(--mut);margin-bottom:8px"></small>
    <button id="dNew">Новый чат по нику</button>
    <button id="dGroup">Новая группа</button>
    <button id="dChannel">Новый канал</button>
    <button id="dNotif">🔔 Уведомления</button>
    <div style="flex:1"></div>
    <button id="dOut" style="background:#3a2a2a">Выйти</button>
  </div>
</div>
<div id="ctx" class="hid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== настройки ===== */
const SUPABASE_URL = 'https://pwfvhpopsoqtapqlhxmc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ruHMxOi16uukhVT8B3Pdxg_bZ6x5bFD';
const sb = SUPABASE_URL.includes('ВАШ') ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const SERVICE = 'https://ntfy.sh';
const SERVER_URL = 'https://ВАШ-СЕРВИС.onrender.com'; // ← вставьте сюда адрес с Render
const APP_VERSION = '1.0.0'; // при каждом обновлении меняйте на 1.0.1, 1.1.0 и т.д.

/* ===== утилиты ===== */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const LS = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)) }
};
async function hex(s){ return [...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)))].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32); }
const profileTopic = async u => 'msgr_p_' + await hex('profile|' + u);
const inboxTopic   = async u => 'msgr_'   + await hex('inbox|' + u);
const groupTopic   = async id => 'msgr_g_' + await hex('group|' + id);
const validName = s => { const n = s.trim().replace(/^@/, '').toLowerCase(); return /^[a-z0-9_]{3,20}$/.test(n) ? n : null; };

/* ===== состояние ===== */
let me = null, myPriv = null, myPub = null, active = null, isLogin = true;
const keys = {}, gkeys = {}, blobs = new Map(), streams = new Map();
let rec = null, recChunks = [], lpTimer = null, lpX = 0, lpY = 0, lpFired = false;
const contacts = () => LS.get('msgr.contacts.' + me, {});
const saveContacts = c => LS.set('msgr.contacts.' + me, c);
const hist = () => LS.get('msgr.hist.' + me, {});
const saveHist = h => LS.set('msgr.hist.' + me, h);
const groups = () => LS.get('msgr.groups.' + me, {});
const saveGroups = g => LS.set('msgr.groups.' + me, g);
const pins = () => LS.get('msgr.pins.' + me, []);
const savePins = p => LS.set('msgr.pins.' + me, p);
const unread = () => LS.get('msgr.unread.' + me, {});
const saveUnread = u => LS.set('msgr.unread.' + me, u);

/* ===== криптография ===== */
async function wrapKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealPrivate(priv, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await wrapKey(pw, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, await crypto.subtle.exportKey('pkcs8', priv));
  return {salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function openPrivate(blob, pw){
  const key = await wrapKey(pw, unb64(blob.salt));
  const p = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return crypto.subtle.importKey('pkcs8', p, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveKey']);
}
async function sharedKey(priv, pubJwk){
  const pub = await crypto.subtle.importKey('jwk', pubJwk, {name:'ECDH', namedCurve:'P-256'}, false, []);
  return crypto.subtle.deriveKey({name:'ECDH', public:pub}, priv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return b64(iv) + '.' + b64(ct);
}
async function open(key, s){
  const i = s.indexOf('.');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(s.slice(0, i))}, key, unb64(s.slice(i + 1)));
  return JSON.parse(dec.decode(pt));
}
async function peerKey(u){
  if (keys[u]) return keys[u];
  const all = contacts(); let c = all[u];
  if (!c){
    const pub = await lookupUser(u);
    if (!pub) throw new Error('@' + u + ' не найден');
    c = all[u] = {pub}; saveContacts(all);
  }
  keys[u] = await sharedKey(myPriv, c.pub);
  return keys[u];
}
async function groupKey(g){
  if (!gkeys[g.id]) gkeys[g.id] = await crypto.subtle.importKey('raw', unb64(g.key), 'AES-GCM', false, ['encrypt','decrypt']);
  return gkeys[g.id];
}

/* ===== поиск пользователей через публичный профиль ===== */
async function lookupUser(u){
  if (!sb){
    try{
      const r = await fetch(`${SERVICE}/${await profileTopic(u)}/json?poll=1`);
      const msgs = (await r.text()).split('\n').filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === 'message');
      return msgs.length ? JSON.parse(msgs[msgs.length - 1].message).pub : null;
    }catch{ return null; }
  }
  const {data} = await sb.from('public_keys').select('pub').eq('username', u).maybeSingle();
  return data ? data.pub : null;
}
async function publishProfile(){
  try{ await pubText(await profileTopic(me), JSON.stringify({pub:myPub})); }catch{}
}

/* ===== отправка ===== */
async function pubText(topic, message){
  if (message.length > 3500) throw new Error('Сообщение слишком длинное');
  const r = await fetch(SERVICE, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic, message})});
  if (!r.ok) throw new Error('Нет связи с сервером. Сообщение не отправлено');
  return (await r.json()).id;
}
async function pubBytes(topic, header, bytes){
  const r = await fetch(`${SERVICE}/${topic}`, {method:'PUT', headers:{'X-Filename':'file.bin', 'X-Message':header}, body:bytes});
  if (!r.ok) throw new Error('Не удалось загрузить файл');
  return (await r.json()).id;
}
async function target(ck){
  if (ck.startsWith('d:')){
    const u = ck.slice(2);
    return {topic:await inboxTopic(u), key:await peerKey(u)};
  }
  const g = groups()[ck.slice(2)];
  if (!g) throw new Error('Группа не найдена');
  return {topic:g.topic, key:await groupKey(g)};
}
function isReadOnly(ck){
  if (!ck || !ck.startsWith('g:')) return false;
  const g = groups()[ck.slice(2)];
  return !!(g && g.channel && g.owner !== me);
}

async function sendText(){
  const t = $('#txt').value.trim();
  if (!t || !active || isReadOnly(active)) return;
  $('#txt').value = '';
  try{
    const tg = await target(active), ts = Date.now();
    const id = await pubText(tg.topic, me + '|' + await seal(tg.key, {t:'m', x:t, ts}));
    addMsg(active, {id, from:me, k:'txt', x:t, ts, mine:true});
    renderAll();
  }catch(e){ $('#txt').value = t; alert(e.message); }
}
async function sendBytes(bytes, mime, name, kind){
  if (!active || isReadOnly(active)) return;
  const tg = await target(active), ts = Date.now();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, tg.key, bytes);
  const header = me + '|' + b64(iv) + '.' + await seal(tg.key, {k:kind, n:name, mime, ts});
  const id = await pubBytes(tg.topic, header, ct);
  blobs.set(id, URL.createObjectURL(new Blob([bytes], {type:mime})));
  addMsg(active, {id, from:me, k:kind, n:name, mime, ts, mine:true});
  renderAll();
}

/* ===== приём ===== */
function splitIn(m){ const i = m.message.indexOf('|'); return {from:m.message.slice(0, i), rest:m.message.slice(i + 1)}; }
async function decodeMsg(m, key){
  const {from, rest} = splitIn(m);
  if (!m.attachment){
    const p = await open(key, rest);
    return {p, from, rec:{id:m.id, from, k:'txt', x:p.x, ts:p.ts, mine:from === me}};
  }
  const j = rest.indexOf('.');
  const iv = unb64(rest.slice(0, j));
  const meta = await open(key, rest.slice(j + 1));
  const ct = await (await fetch(m.attachment.url)).arrayBuffer();
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  blobs.set(m.id, URL.createObjectURL(new Blob([plain], {type:meta.mime || 'application/octet-stream'})));
  return {p:meta, from, rec:{id:m.id, from, k:meta.k, n:meta.n, mime:meta.mime, ts:meta.ts, mine:from === me}};
}
function addMsg(ck, r){
  const h = hist(); h[ck] = h[ck] || [];
  if (h[ck].some(x => x.id === r.id)) return false;
  h[ck].push(r);
  if (h[ck].length > 500) h[ck].splice(0, h[ck].length - 500);
  saveHist(h);
  if (active !== ck && !r.mine){ const u = unread(); u[ck] = (u[ck] || 0) + 1; saveUnread(u); }
  return true;
}
function notify(title, r){
  if (!r.mine && document.hidden && 'Notification' in window && Notification.permission === 'granted')
    new Notification(title, {body: r.k === 'txt' ? r.x : '📎 вложение'});
}
async function onInbox(m){
  const {from} = splitIn(m);
  const key = await peerKey(from);
  const {p, rec} = await decodeMsg(m, key);
  if (p.t === 'inv') return acceptInvite(p.g);
  if (addMsg('d:' + from, rec)){ notify('@' + from, rec); renderAll(); }
}
async function onGroup(gid, m){
  const g = groups()[gid]; if (!g) return;
  const {from} = splitIn(m);
  if (!g.members.includes(from)) return;
  if (g.channel && from !== g.owner) return;
  const {rec} = await decodeMsg(m, await groupKey(g));
  if (addMsg('g:' + gid, rec)){ notify(g.name, rec); renderAll(); }
}
async function acceptInvite(g){
  const all = groups();
  if (all[g.id]) return;
  all[g.id] = g; saveGroups(all);
  openStream(g.topic, m => onGroup(g.id, m));
  renderAll();
}

/* ===== соединение с автопереподключением ===== */
function openStream(topic, onMsg){
  const st = streams.get(topic) || {fails:0, open:false};
  st.onMsg = onMsg;
  streams.set(topic, st);
  connect(topic, st);
}
function connect(topic, st){
  clearTimeout(st.timer);
  if (st.es) st.es.close();
  const since = LS.get('msgr.since.' + topic, 'all');
  const es = new EventSource(`${SERVICE}/${topic}/sse?since=${since}`);
  st.es = es;
  es.onopen = () => { st.open = true; st.fails = 0; setStatus(); };
  es.onmessage = e => {
    let m; try { m = JSON.parse(e.data) } catch { return }
    if (m.event !== 'message') return;
    LS.set('msgr.since.' + topic, m.id);
    Promise.resolve(st.onMsg(m)).catch(() => {});
  };
  es.onerror = () => {
    st.open = false; es.close(); st.fails++; setStatus();
    st.timer = setTimeout(() => connect(topic, st), Math.min(15000, 1000 * 2 ** Math.min(st.fails, 4)));
  };
}
function setStatus(){
  const all = [...streams.values()];
  $('#status').textContent = !navigator.onLine ? 'нет сети, ждём...' : all.some(s => !s.open) ? 'подключение...' : 'онлайн';
}
function reconnectAll(){
  for (const [t, st] of streams) if (!st.open){ st.fails = 0; connect(t, st); }
  setStatus();
}
addEventListener('online', reconnectAll);
addEventListener('offline', setStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) reconnectAll(); });

async function startStreams(){
  openStream(await inboxTopic(me), onInbox);
  for (const g of Object.values(groups())) openStream(g.topic, m => onGroup(g.id, m));
}

/* ===== рендер ===== */
function preview(r){
  if (r.k === 'txt') return r.x;
  if (r.k === 'voice') return '🎤 Голосовое';
  return '📎 ' + (r.n || 'файл');
}
function chatList(){
  const items = [];
  for (const u of Object.keys(contacts())) items.push({ck:'d:' + u, name:'@' + u});
  for (const g of Object.values(groups())) items.push({ck:'g:' + g.id, name:(g.channel ? '📢 ' : '👥 ') + g.name});
  const h = hist(), p = pins(), un = unread();
  for (const it of items){
    const arr = h[it.ck] || [];
    it.last = arr[arr.length - 1];
    it.ts = it.last ? it.last.ts : 0;
    it.pinned = p.includes(it.ck);
    it.unread = un[it.ck] || 0;
  }
  return items.sort((a, b) => (b.pinned - a.pinned) || (b.ts - a.ts));
}
function renderChats(){
  const list = chatList();
  $('#chats').innerHTML = list.length ? list.map(it => `
    <div class="it ${it.ck === active ? 'on' : ''}" data-ctx="chat" data-key="${esc(it.ck)}">
      <div class="n"><b>${esc(it.name)}</b><small>${it.last ? esc(preview(it.last)) : 'нет сообщений'}</small></div>
      ${it.pinned ? '<span class="pin">📌</span>' : ''}
      ${it.unread ? `<span class="badge">${it.unread}</span>` : ''}
    </div>`).join('') : '<div class="empty">Чатов пока нет</div>';
}
function bubble(r, isG){
  const url = blobs.get(r.id);
  let body;
  if (r.k === 'txt') body = esc(r.x);
  else if (!url) body = '<i style="color:var(--mut)">вложение недоступно (истекло или страница перезагружена)</i>';
  else if (r.k === 'voice') body = `<audio controls src="${url}"></audio>`;
  else if (r.mime && r.mime.startsWith('image/')) body = `<img src="${url}" alt="">`;
  else if (r.mime && r.mime.startsWith('video/')) body = `<video controls src="${url}"></video>`;
  else body = `<a href="${url}" download="${esc(r.n)}" style="color:#9cc8ff">📎 ${esc(r.n)}</a>`;
  return `<div class="bub ${r.mine ? 'out' : ''}" data-ctx="msg" data-id="${esc(r.id)}">${isG && !r.mine ? `<span class="who">@${esc(r.from)}</span>` : ''}${body}<small>${fmt(r.ts)}</small></div>`;
}
function renderMsgs(){
  if (!active){
    $('#msgs').innerHTML = '<div class="empty">Нажмите ☰ и введите ник собеседника, например @anna.</div>';
    return;
  }
  const list = (hist()[active] || []).slice().sort((a, b) => a.ts - b.ts);
  $('#msgs').innerHTML = list.length ? list.map(r => bubble(r, active.startsWith('g:'))).join('') : '<div class="empty">Сообщений пока нет</div>';
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
}
function renderAll(){ renderChats(); renderMsgs(); }

function openChat(ck){
  active = ck;
  const u = unread(); delete u[ck]; saveUnread(u);
  const isG = ck.startsWith('g:');
  const g = isG ? groups()[ck.slice(2)] : null;
  $('#hn').textContent = isG ? (g ? g.name : 'Группа') : '@' + ck.slice(2);
  $('#hs').textContent = isG ? (g && g.channel ? 'канал' : 'группа, ' + (g ? g.members.length : 0) + ' уч.') : 'личный чат';
  const ro = isReadOnly(ck);
  for (const id of ['#txt', '#attach', '#mic', '#send']) $(id).disabled = ro;
  $('#txt').placeholder = ro ? 'Писать может только владелец' : 'Сообщение';
  $('#cb').classList.remove('hid');
  $('#app').classList.add('open');
  renderAll();
}

/* ===== контекстное меню: правая кнопка и долгое нажатие ===== */
function showCtx(el, x, y){
  const type = el.dataset.ctx, items = [];
  if (type === 'chat'){
    const ck = el.dataset.key, pinned = pins().includes(ck);
    items.push([pinned ? 'Открепить' : 'Закрепить', () => {
      const p = pins(); savePins(pinned ? p.filter(k => k !== ck) : [...p, ck]); renderChats();
    }]);
    items.push(['Очистить историю у себя', () => {
      const h = hist(); delete h[ck]; saveHist(h);
      if (active === ck) renderMsgs(); renderChats();
    }, true]);
  } else {
    const id = el.dataset.id, r = (hist()[active] || []).find(x => x.id === id);
    if (r && r.k === 'txt') items.push(['Копировать', () => navigator.clipboard?.writeText(r.x).catch(() => {})]);
    items.push(['Удалить у себя', () => {
      const h = hist(); h[active] = (h[active] || []).filter(x => x.id !== id); saveHist(h); renderAll();
    }, true]);
  }
  const box = $('#ctx');
  box.innerHTML = items.map((it, i) => `<button class="${it[2] ? 'danger' : ''}" data-i="${i}">${esc(it[0])}</button>`).join('');
  box.classList.remove('hid');
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  box.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    hideCtx(); items[+b.dataset.i][1]();
  };
}
function hideCtx(){ $('#ctx').classList.add('hid'); }

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctx')) hideCtx();
  const t = e.target.closest('[data-ctx]');
  lpFired = false;
  if (!t) return;
  lpX = e.clientX; lpY = e.clientY;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; showCtx(t, lpX, lpY); }, 500);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpTimer)));
document.addEventListener('pointermove', e => {
  if (Math.hypot(e.clientX - lpX, e.clientY - lpY) > 10) clearTimeout(lpTimer);
});
document.addEventListener('contextmenu', e => {
  const t = e.target.closest('[data-ctx]');
  if (!t) return;
  e.preventDefault();
  showCtx(t, e.clientX, e.clientY);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });

/* ===== события интерфейса ===== */
$('#chats').onclick = e => {
  if (lpFired){ lpFired = false; return; }
  const it = e.target.closest('.it');
  if (it) openChat(it.dataset.key);
};
$('#back').onclick = () => {
  active = null;
  $('#app').classList.remove('open');
  $('#cb').classList.add('hid');
  $('#hn').textContent = 'Выберите чат'; $('#hs').textContent = '';
  renderAll();
};
$('#send').onclick = sendText;
$('#txt').onkeydown = e => { if (e.key === 'Enter') sendText(); };

$('#attach').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !active) return;
  if (f.size > 10 * 1024 * 1024) return alert('Файл больше 10 МБ');
  try{ await sendBytes(await f.arrayBuffer(), f.type || 'application/octet-stream', f.name, 'file'); }
  catch(err){ alert(err.message); }
};

$('#mic').onclick = async () => {
  if (rec){ rec.stop(); return; }
  if (!active) return alert('Сначала откройте чат');
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch{ return alert('Нет доступа к микрофону'); }
  recChunks = [];
  const r = new MediaRecorder(stream);
  rec = r;
  r.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  r.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = r.mimeType || 'audio/webm';
    const blob = new Blob(recChunks, {type:mime});
    rec = null;
    $('#mic').classList.remove('rec');
    if (blob.size){
      try{ await sendBytes(await blob.arrayBuffer(), mime, 'voice', 'voice'); }
      catch(err){ alert(err.message); }
    }
  };
  r.start();
  $('#mic').classList.add('rec');
};

/* ===== вход и регистрация ===== */
$('#tg').onclick = e => {
  e.preventDefault(); isLogin = !isLogin;
  $('#at').textContent = isLogin ? 'Вход' : 'Регистрация';
  $('#go').textContent = isLogin ? 'Войти' : 'Создать аккаунт';
  $('#tg').textContent = isLogin ? 'Регистрация' : 'Уже есть аккаунт? Войти';
  $('#err').textContent = '';
};
$('#go').onclick = async () => {
  const u = validName($('#u').value), pw = $('#pw').value;
  $('#err').textContent = '';
  if (!u) return $('#err').textContent = 'Ник: 3–20 символов, латиница, цифры или _';
  if (pw.length < 6) return $('#err').textContent = 'Пароль от 6 символов';
  $('#go').disabled = true; $('#go').textContent = 'Подождите...';
  try{
    if (isLogin){
      if (!sb){
        const rec0 = LS.get('msgr.acc.' + u, null);
        if (!rec0) throw new Error('Аккаунт не найден на этом устройстве');
        myPriv = await openPrivate(rec0.priv, pw).catch(() => { throw new Error('Неверный пароль'); });
        myPub = rec0.pub; me = u;
      } else {
      const {error} = await sb.auth.signInWithPassword({email: u + '@users.messenger.app', password: pw});
      if (error) throw new Error('Неверный ник или пароль');
      const pubRow = await sb.from('public_keys').select('pub').eq('username', u).maybeSingle();
      const privRow = await sb.from('private_keys').select('priv').maybeSingle();
      if (!pubRow.data || !privRow.data) throw new Error('Профиль не найден');
      myPriv = await openPrivate(privRow.data.priv, pw).catch(() => { throw new Error('Неверный пароль'); });
      myPub = pubRow.data.pub; me = u;
      }
    } else {
      if (!sb){
        if (LS.get('msgr.acc.' + u, null)) throw new Error('Этот ник уже зарегистрирован на этом устройстве');
        const kpL = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']);
        const jwkL = await crypto.subtle.exportKey('jwk', kpL.publicKey);
        myPub = {kty:jwkL.kty, crv:jwkL.crv, x:jwkL.x, y:jwkL.y};
        LS.set('msgr.acc.' + u, {pub:myPub, priv:await sealPrivate(kpL.privateKey, pw)});
        myPriv = kpL.privateKey; me = u;
      } else {
      if (await lookupUser(u)) throw new Error('Этот ник уже занят');
      const {data: signed, error: signErr} = await sb.auth.signUp({email: u + '@users.messenger.app', password: pw});
      if (signErr) throw new Error(signErr.message.includes('already') ? 'Этот ник уже занят' : signErr.message);
      const kp = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']);
      const {kty, crv, x, y} = await crypto.subtle.exportKey('jwk', kp.publicKey);
      myPub = {kty, crv, x, y};
      const priv = await sealPrivate(kp.privateKey, pw);
      const uid = signed.user.id;
      const r1 = await sb.from('public_keys').insert({username: u, pub: myPub, user_id: uid});
      const r2 = await sb.from('private_keys').insert({user_id: uid, priv});
      if (r1.error || r2.error) throw new Error('Не удалось сохранить профиль на сервере');
      myPriv = kp.privateKey; me = u;
      }
    }
    await enterApp();
    $('#pw').value = '';
  }catch(e){
    me = null; $('#err').textContent = e.message;
  }finally{
    $('#go').disabled = false; $('#go').textContent = isLogin ? 'Войти' : 'Создать аккаунт';
  }
};
$('#u').onkeydown = e => { if (e.key === 'Enter') $('#pw').focus(); };
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };

async function enterApp(){
  $('#auth').classList.add('hid');
  $('#app').classList.remove('hid');
  $('#me').textContent = '@' + me;
  $('#ver').textContent = 'версия ' + APP_VERSION;
  publishProfile();
  await startStreams();
  renderAll(); setStatus();
}
setInterval(() => { if (me) publishProfile(); }, 30 * 60 * 1000);

/* ===== меню ☰ ===== */
const openDrawer = () => $('#drawer').classList.add('open');
const closeDrawer = () => $('#drawer').classList.remove('open');
$('#menu').onclick = openDrawer;
$('#drawer').onclick = e => { if (e.target.id === 'drawer') closeDrawer(); };

$('#dNew').onclick = async () => {
  closeDrawer();
  const s = prompt('Ник собеседника, например @anna:');
  if (!s) return;
  const u = validName(s);
  if (!u) return alert('Неверный ник');
  if (u === me) return alert('Это вы');
  try{ await peerKey(u); }
  catch(e){ return alert(e.message + '. Собеседник должен хотя бы раз войти в приложение.'); }
  openChat('d:' + u); renderChats();
};

async function makeGroup(channel){
  closeDrawer();
  const name = prompt(channel ? 'Название канала:' : 'Название группы:');
  if (!name || !name.trim()) return;
  const members = [...new Set([me, ...(prompt('Ники участников через пробел, например @anna @boris:') || '')
    .split(/[\s,]+/).map(validName).filter(Boolean)])];
  if (members.length < 2) return alert('Добавьте хотя бы одного участника');
  try{
    const bad = [];
    for (const u of members){
      if (u === me) continue;
      try{ await peerKey(u); }catch{ bad.push(u); }
    }
    if (bad.length) return alert('Не найдены: ' + bad.map(u => '@' + u).join(', '));
    const gid = [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');
    const g = {id:gid, name:name.trim(), owner:me, channel, members,
      key:b64(crypto.getRandomValues(new Uint8Array(32))), topic:await groupTopic(gid)};
    const all = groups(); all[gid] = g; saveGroups(all);
    for (const u of members){
      if (u === me) continue;
      const k = await peerKey(u);
      await pubText(await inboxTopic(u), me + '|' + await seal(k, {t:'inv', g, ts:Date.now()}));
    }
    openStream(g.topic, m => onGroup(gid, m));
    openChat('g:' + gid); renderChats();
  }catch(e){ alert(e.message); }
}
$('#dGroup').onclick = () => makeGroup(false);
$('#dChannel').onclick = () => makeGroup(true);

$('#dNotif').onclick = async () => {
  closeDrawer();
  if (!('Notification' in window)) return alert('Уведомления не поддерживаются');
  const r = await Notification.requestPermission();
  alert(r === 'granted' ? 'Уведомления включены' : 'Уведомления не разрешены');
};

$('#dOut').onclick = () => {
  closeDrawer();
  for (const st of streams.values()){ clearTimeout(st.timer); if (st.es) st.es.close(); }
  streams.clear();
  for (const k in keys) delete keys[k];
  for (const k in gkeys) delete gkeys[k];
  blobs.forEach(u => URL.revokeObjectURL(u)); blobs.clear();
  me = null; myPriv = null; myPub = null; active = null;
  $('#app').classList.add('hid'); $('#app').classList.remove('open');
  $('#auth').classList.remove('hid');
  $('#msgs').innerHTML = ''; $('#chats').innerHTML = '';
  $('#cb').classList.add('hid');
};
</script>
